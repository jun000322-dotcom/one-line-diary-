<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 줄 일기</title>
<!-- 폰 홈 화면에 앱처럼 설치 (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한 줄 일기">
<style>
  :root {
    --bg: #faf8f4; --card: #ffffff; --text: #2b2a28; --muted: #8a867e;
    --line: #e8e4dc; --accent: #d9774b; --accent-soft: #fbeee6; --dot: #e6e1d7;
    --chip: #f3f0ea;
    --holiday: #d64545; --sat: #3b6fd1;
    --price: #b4541a; --price-bg: #fde7d6;
    --jobs: #2f7d4f; --jobs-bg: #dcf1e3;
    --fomc: #5b4bc4; --fomc-bg: #e6e2fb;
    --growth: #0f7c8c; --growth-bg: #d5eff2;
    --market: #6b6760; --market-bg: #ebe7e0;
    /* 달력 칸에 칠하는 기분 색 */
    --m-joy: #fff1bf; --m-calm: #e0f2dc; --m-meh: #eceae5; --m-sad: #dce8fa;
    --m-angry: #fbdcd8; --m-tired: #e9e1f6; --m-anxious: #fbe5cf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --card: #252421; --text: #ece9e3; --muted: #9a958c;
      --line: #36342f; --accent: #e8915f; --accent-soft: #3a2b22; --dot: #34322d;
      --chip: #2f2d29;
      --holiday: #f07171; --sat: #7ea6f0;
      --price: #f5a46b; --price-bg: #46301f;
      --jobs: #7fd3a0; --jobs-bg: #1f3a2a;
      --fomc: #b3a8ff; --fomc-bg: #2f2a4d;
      --growth: #6fd0dc; --growth-bg: #173a3f;
      --market: #b5afa5; --market-bg: #3a3833;
      --m-joy: #3f3717; --m-calm: #213526; --m-meh: #302e2a; --m-sad: #1f2c40;
      --m-angry: #40231f; --m-tired: #2e2641; --m-anxious: #3f2d1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 80px; }
  /* 홈 화면 앱으로 열면 노치·홈 표시줄을 피합니다 */
  @supports (padding: env(safe-area-inset-top)) {
    main {
      padding-top: calc(40px + env(safe-area-inset-top));
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }
  }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .streak { color: var(--muted); font-size: 14px; }
  .streak b { color: var(--accent); }

  /* ---------- 백업 알림 ---------- */
  .backup {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: var(--accent-soft); border-radius: 12px; padding: 10px 14px;
    margin-bottom: 16px; font-size: 13px;
  }
  .backup[hidden] { display: none; }
  .backup .msg { flex: 1; min-width: 200px; }
  .backup .actions { display: flex; gap: 4px; margin-left: auto; }
  .backup button { font-size: 13px; padding: 4px 12px; }

  .today {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 28px;
  }
  .today .date { font-size: 14px; color: var(--muted); margin-bottom: 12px; }

  .picker { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .picker .label { font-size: 13px; color: var(--muted); width: 32px; flex-shrink: 0; }
  .emojis { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji {
    font-size: 20px; line-height: 1; width: 38px; height: 38px; padding: 0;
    border-radius: 10px; background: var(--chip); border: 2px solid transparent;
    color: inherit; transition: transform .1s;
  }
  .emoji:hover { transform: scale(1.08); }
  .emoji[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .row { display: flex; gap: 8px; margin-top: 6px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--text);
    background: transparent; border: none; border-bottom: 2px solid var(--line);
    padding: 8px 2px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    font: inherit; font-size: 14px; border: none; border-radius: 10px; cursor: pointer;
    padding: 8px 16px; background: var(--accent); color: #fff; white-space: nowrap;
  }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
  button.ghost:hover { color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .saved { color: var(--accent); opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }

  /* ---------- 지난 오늘 ---------- */
  .lookback { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .lookback[hidden] { display: none; }
  button.lb-item {
    display: block; width: 100%; text-align: left; white-space: normal;
    background: var(--chip); color: var(--text); padding: 10px 12px;
  }
  button.lb-item:hover { background: var(--accent-soft); }
  .lb-label { font-size: 12px; color: var(--muted); }
  .lb-text { font-size: 14px; word-break: break-word; }

  .news {
    margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft);
    font-size: 14px;
  }
  .news[hidden] { display: none; }
  .news .why { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .news .tag {
    display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; margin-right: 6px;
    background: var(--card); color: var(--accent); font-weight: 600;
  }
  .news .title { color: var(--text); font-weight: 600; font-size: 16px; line-height: 1.45; }
  .news .summary { color: var(--text); opacity: .8; margin: 6px 0 10px; line-height: 1.7; }
  .news .orig { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin-bottom: 10px; }
  .news .orig[hidden] { display: none; }
  .news .foot { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .news .foot a { color: var(--accent); }
  .news .foot button { margin-left: auto; font-size: 12px; padding: 2px 6px; }

  /* ---------- 달력 ---------- */
  .cal { margin-bottom: 28px; }
  .cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .cal-head .ym { font-size: 17px; font-weight: 700; margin-right: auto; letter-spacing: -0.01em; }
  .cal-head button { padding: 4px 10px; font-size: 15px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0 4px; }
  .dow.sun { color: var(--holiday); } .dow.sat { color: var(--sat); }
  button.day {
    height: 78px; padding: 4px 5px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); text-align: left; white-space: normal;
    display: flex; flex-direction: column; gap: 2px; overflow: hidden; font-size: 11px; line-height: 1.3;
  }
  button.day:hover { border-color: var(--muted); }
  button.day.other { opacity: .38; }
  button.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button.day.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--muted); }
  /* 기분 색 (선택한 날도 기분 색을 유지하고 테두리로 구분) */
  button.day.m-joy, .mood-dot.m-joy { background: var(--m-joy); }
  button.day.m-calm, .mood-dot.m-calm { background: var(--m-calm); }
  button.day.m-meh, .mood-dot.m-meh { background: var(--m-meh); }
  button.day.m-sad, .mood-dot.m-sad { background: var(--m-sad); }
  button.day.m-angry, .mood-dot.m-angry { background: var(--m-angry); }
  button.day.m-tired, .mood-dot.m-tired { background: var(--m-tired); }
  button.day.m-anxious, .mood-dot.m-anxious { background: var(--m-anxious); }
  .mood-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); margin-right: 3px; vertical-align: -1px; }
  .day .num { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
  .day.sun .num, .day.hol .num { color: var(--holiday); }
  .day.sat:not(.hol) .num { color: var(--sat); }
  .day .mark { font-size: 13px; line-height: 1; }
  .day .hname { color: var(--holiday); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: wrap; gap: 2px; min-height: 0; overflow: hidden; }
  .chip { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  .chip.price { background: var(--price-bg); color: var(--price); }
  .chip.jobs { background: var(--jobs-bg); color: var(--jobs); }
  .chip.fomc { background: var(--fomc-bg); color: var(--fomc); }
  .chip.growth { background: var(--growth-bg); color: var(--growth); }
  .chip.market { background: var(--market-bg); color: var(--market); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 8px; align-items: center; }
  .legend .chip { margin-right: 3px; }
  .cal-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .cal-detail {
    margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-size: 14px;
  }
  .cal-detail h3 { margin: 0 0 8px; font-size: 15px; }
  .cal-detail .item { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
  .cal-detail .item .chip { flex-shrink: 0; }
  .cal-detail .sub { color: var(--muted); font-size: 12px; }
  .cal-detail .hol-item { color: var(--holiday); font-weight: 600; }
  .cal-detail + .cal-detail { margin-top: 10px; }
  .cal-detail .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-detail .head h3 { margin: 0; }
  .cal-detail .head .actions { display: flex; }
  .cal-detail .diary-text { word-break: break-word; }
  .cal-detail .diary-text input[type=text] { font-size: 15px; padding: 2px; width: 100%; }
  .cal-detail .diary-news { color: var(--muted); font-size: 12px; text-decoration: none; display: block; margin-top: 4px; }
  .cal-detail .diary-news:hover { color: var(--accent); }
  footer { display: flex; gap: 4px; justify-content: center; margin-top: 32px; }
  @media (max-width: 480px) {
    .emoji { width: 34px; height: 34px; font-size: 18px; }
    /* 좁은 화면에서는 칸 안의 글자 대신 색 점으로 */
    button.day { height: 58px; padding: 3px; }
    .day .hname { font-size: 9px; }
    .day .chip { font-size: 0; width: 7px; height: 7px; padding: 0; border-radius: 50%; }
    .chip.price { background: var(--price); } .chip.jobs { background: var(--jobs); } .chip.fomc { background: var(--fomc); }
    .chip.growth { background: var(--growth); } .chip.market { background: var(--market); }
    .cal-detail .chip, .legend .chip { font-size: 10px; width: auto; height: auto; padding: 0 4px; border-radius: 4px; }
    .cal-detail .chip.price, .legend .chip.price { background: var(--price-bg); }
    .cal-detail .chip.jobs, .legend .chip.jobs { background: var(--jobs-bg); }
    .cal-detail .chip.fomc, .legend .chip.fomc { background: var(--fomc-bg); }
    .cal-detail .chip.growth, .legend .chip.growth { background: var(--growth-bg); }
    .cal-detail .chip.market, .legend .chip.market { background: var(--market-bg); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>한 줄 일기</h1>
    <div class="streak" id="streak"></div>
  </header>

  <div class="backup" id="backup" role="status" hidden>
    <span class="msg" id="backupMsg"></span>
    <div class="actions">
      <button type="button" id="backupNow">지금 백업</button>
      <button type="button" class="ghost" id="backupLater">나중에</button>
    </div>
  </div>

  <section class="today">
    <div class="date" id="todayLabel"></div>
    <div class="picker">
      <span class="label">날씨</span>
      <div class="emojis" id="weatherPicker" role="group" aria-label="오늘의 날씨"></div>
    </div>
    <div class="picker">
      <span class="label">기분</span>
      <div class="emojis" id="moodPicker" role="group" aria-label="오늘의 기분"></div>
    </div>
    <form class="row" id="todayForm">
      <input type="text" id="todayInput" maxlength="120" placeholder="오늘을 한 줄로 남겨보세요" autocomplete="off">
      <button type="submit" id="saveBtn">저장</button>
    </form>
    <div class="meta">
      <span class="saved" id="savedMsg">저장했어요 ✓</span>
      <span id="count">0 / 120</span>
    </div>

    <div class="lookback" id="lookback" hidden></div>

    <div class="news" id="news" hidden>
      <div class="why" id="newsWhy"></div>
      <div id="newsBody"></div>
    </div>
  </section>

  <section class="cal">
    <div class="cal-head">
      <span class="ym" id="calTitle"></span>
      <button class="ghost" id="calPrev" aria-label="이전 달">‹</button>
      <button class="ghost" id="calToday">오늘</button>
      <button class="ghost" id="calNext" aria-label="다음 달">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><span class="chip price">물가</span>CPI·PCE·PPI</span>
      <span><span class="chip jobs">고용</span>고용보고서</span>
      <span><span class="chip growth">성장</span>GDP·소매판매</span>
      <span><span class="chip fomc">금리</span>FOMC·한국은행</span>
      <span><span class="chip market">휴장</span>미국 증시 휴장·조기폐장</span>
    </div>
    <div class="legend" id="moodLegend" aria-label="기분 색"></div>
    <div class="cal-note" id="calNote"></div>
    <div class="cal-detail" id="calEvents"></div>
    <div class="cal-detail" id="calDiary"></div>
  </section>

  <footer>
    <button class="ghost" id="exportBtn">내보내기</button>
    <button class="ghost" id="importBtn">가져오기</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</main>

<script>
'use strict';
const KEY = 'one-line-diary';
const FEED_CACHE_KEY = 'one-line-diary-feed-v2';
const MAX = 120;
const $ = id => document.getElementById(id);

// ---------- 날씨 · 기분 ----------
const WEATHERS = [
  { e: '☀️', n: '맑음' }, { e: '⛅', n: '구름 조금' }, { e: '☁️', n: '흐림' }, { e: '🌧️', n: '비' },
  { e: '⛈️', n: '뇌우' }, { e: '❄️', n: '눈' }, { e: '🌫️', n: '안개' }, { e: '💨', n: '바람' },
];
// 좋은 기분은 '유지', 나쁜 기분은 '전환'하는 소식을 고릅니다.
// id: 달력 칸 색 클래스(m-<id>) 이름
// kw: 뉴스 고를 때 쓰는 영어 키워드 (제목에 있으면 2점, 요약에 있으면 1점)
const MOODS = [
  { e: '😄', n: '기쁨', id: 'joy', goal: '기분 유지', why: '기쁜 날엔 함께 축하하고 싶은 소식으로 기쁨을 이어가요',
    kw: ['success', 'record', 'first', 'win', 'wins', 'celebrat', 'breakthrough', 'joy', 'restored', 'saved', 'approved', 'achiev', 'milestone', 'return'] },
  { e: '😌', n: '평온', id: 'calm', goal: '기분 유지', why: '평온한 하루엔 잔잔하고 따뜻한 이야기로 그 마음을 지켜요',
    kw: ['nature', 'garden', 'bird', 'forest', 'ocean', 'tree', 'tea', 'library', 'music', 'art', 'retired', 'community', 'peaceful', 'quiet', 'walk'] },
  { e: '😐', n: '무덤덤', id: 'meh', goal: '기분 전환', why: '무덤덤한 날엔 호기심이 반짝 깨어나는 놀라운 발견을 가져왔어요',
    kw: ['discover', 'surprising', 'ancient', 'space', 'hidden', 'first-ever', 'rare', 'mystery', 'species', 'unexpected', 'reveal', 'fossil', 'planet', 'secret'] },
  { e: '😢', n: '슬픔', id: 'sad', goal: '기분 전환', why: '마음이 무거운 날엔 누군가의 따뜻한 선행 이야기를 건네요',
    kw: ['kindness', 'kind', 'donat', 'volunteer', 'rescue', 'reunite', 'help', 'community', 'hero', 'generous', 'grateful', 'love', 'gift', 'neighbor', 'stranger'] },
  { e: '😠', n: '화남', id: 'angry', goal: '기분 전환', why: '화가 난 날엔 피식 웃게 되는 귀여운 소식으로 열을 식혀요',
    kw: ['dog', 'cat', 'puppy', 'kitten', 'animal', 'funny', 'laugh', 'smile', 'adorable', 'play', 'baby', 'otter', 'penguin', 'goat', 'bird'] },
  { e: '😴', n: '피곤', id: 'tired', goal: '기분 전환', why: '지친 날엔 기운이 나는 소식으로 작은 활력을 채워요',
    kw: ['energy', 'boost', 'rest', 'sleep', 'recovery', 'coffee', 'walk', 'sunlight', 'refresh', 'young', 'youthful', 'strength', 'restore', 'nap'] },
  { e: '😰', n: '불안', id: 'anxious', goal: '기분 전환', why: '불안한 날엔 세상이 조금씩 나아지고 있다는 증거를 보여드려요',
    kw: ['fall', 'falls', 'decline', 'drop', 'reduce', 'protect', 'restored', 'recover', 'success', 'solution', 'progress', 'safe', 'cleaner', 'prevent', 'lower'] },
];
// 어떤 기분이든 무거운 소식은 피합니다
const HEAVY = ['death', 'deaths', 'dead', 'die', 'dying', 'kill', 'killed', 'harm', 'harming', 'deadly', 'fatal', 'danger',
  'outbreak', 'losing', 'loses', 'toxic', 'suicide', 'war', 'attack', 'crash', 'cancer', 'dementia', 'disease', 'crisis', 'abuse', 'shooting'];
// 모든 기분에 공통으로 반가운 단어
const UPLIFT = ['good news', 'hope', 'happy', 'heartwarming', 'inspir', 'celebrat', 'kindness', 'success', 'thanks'];

const FEEDS = [
  { name: 'Good News Network', url: 'https://www.goodnewsnetwork.org/feed/', bonus: 2 },
  { name: 'Reasons to be Cheerful', url: 'https://reasonstobecheerful.world/feed/', bonus: 2 },
  { name: 'ScienceDaily', url: 'https://www.sciencedaily.com/rss/top/science.xml', bonus: 0 },
  { name: 'ScienceDaily', url: 'https://www.sciencedaily.com/rss/health_medicine.xml', bonus: 0 },
  { name: 'Medical Xpress', url: 'https://medicalxpress.com/rss-feed/', bonus: 0 },
];
// 기사 한 편이 아닌 모음·광고성 글은 제외
const SKIP_TITLE = /^(good news in history|sponsored|podcast)/i;
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';

// ---------- 저장소 ----------
function normalize(v) {
  if (typeof v === 'string') return { text: v };            // 이전 버전(문자열) 호환
  if (v && typeof v === 'object' && typeof v.text === 'string') return v;
  return null;
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY)) || {};
    const out = {};

  } catch { return {}; }
}

// 한 달 전 달에 같은 날짜가 없으면(예: 3/31 → 2/31) 건너뜁니다. 최대 3개.
function lookbacks(k, all) {
  const [y, m, d] = k.split('-').map(Number);
  const md = k.slice(5);
  const out = Object.keys(all)
    .filter(x => x.slice(5) === md && x < k)
    .sort().reverse()
    .map(x => ({ k: x, label: `${y - Number(x.slice(0, 4))}년 전 오늘` }));
  const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  if (d <= new Date(py, pm, 0).getDate()) {
    const mk = `${py}-${pad(pm)}-${pad(d)}`;
    if (all[mk]) out.push({ k: mk, label: '한 달 전 오늘' });
  }
  return out.slice(0, 3);
}

// ---------- 백업 알림 ----------
// { last: 마지막 내보낸 날짜, sig: 그때 일기 내용의 해시, snooze: '나중에'를 누른 날짜 }
const BACKUP_KEY = 'one-line-diary-backup';
const BACKUP_DAYS = 7;
function loadBackup() {
  try { return JSON.parse(localStorage.getItem(BACKUP_KEY)) || {}; } catch { return {}; }
}
function saveBackup(info) {
  try { localStorage.setItem(BACKUP_KEY, JSON.stringify(info)); } catch {}
}
// 일기 내용이 바뀌었는지 비교하기 위한 간단한 해시
function sigOf(all) {
  const s = JSON.stringify(all);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0;
  return `${s.length}:${h}`;
}
function daysBetween(a, b) {
  const t = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((t(b) - t(a)) / 86400000);
}
// 띄울 알림 문구를 돌려줍니다. 알릴 필요가 없으면 null.
// - 백업 후 일기가 바뀌지 않았거나, 오늘 '나중에'를 눌렀으면 알리지 않습니다.
// - 백업한 적이 없으면 첫 일기 날짜부터 셉니다.
function backupMessage(all, info, today) {
  const keys = Object.keys(all).sort();
  if (!keys.length) return null;
  if (info.snooze === today) return null;
  if (info.sig && info.sig === sigOf(all)) return null;
  if (info.last) {
    const n = daysBetween(info.last, today);
    return n >= BACKUP_DAYS ? `마지막 백업 후 ${n}일이 지났어요.` : null;
  }
  const n = daysBetween(keys[0], today);
  return n >= BACKUP_DAYS ? `일기를 ${keys.length}개 썼는데 아직 백업한 적이 없어요.` : null;
}
function renderBackup() {
  const msg = backupMessage(entries, loadBackup(), todayKey());
  $('backup').hidden = !msg;
  if (msg) $('backupMsg').textContent = `💾 ${msg} 브라우저 데이터를 지우면 일기도 사라지니 파일로 내보내 두세요.`;
}

// ---------- 뉴스 ----------
const stripHtml = html => {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
};
// 요약 끝의 "The post ... appeared first on ..." 같은 꼬리말을 떼고, 문장 단위로 600자 안에서 자릅니다
function trimSummary(s) {
  s = s.replace(/\s*(The post .+ appeared first on .+|Continue reading.*|Read more.*)$/i, '').replace(/\s*\[…\]|\s*\[\.\.\.\]/g, '…');
  if (s.length <= 600) return s;
  const cut = s.slice(0, 600);
  const end = cut.lastIndexOf('. ');
  return (end > 200 ? cut.slice(0, end + 1) : cut) + ' …';
}
// rss2json의 pubDate는 "YYYY-MM-DD HH:MM:SS"(UTC) 형식
const parsePub = s => { const d = new Date(String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? null : d; };

async function getFeedItems() {
  try {
    const c = JSON.parse(localStorage.getItem(FEED_CACHE_KEY));
    if (c && c.day === todayKey() && Date.now() - c.at < 3 * 3600e3 && c.items.length) return c.items;
  } catch {}
  const results = await Promise.allSettled(FEEDS.map(async f => {
    const r = await fetch(RSS2JSON + encodeURIComponent(f.url));
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.status !== 'ok') throw new Error(j.message);
    return j.items.map(it => ({
      title: stripHtml(it.title),
      summary: trimSummary(stripHtml(it.description)),
      link: it.link,
      source: f.name,
      bonus: f.bonus,
      date: (parsePub(it.pubDate) || new Date()).toISOString(),
    }));
  }));
  const items = results.filter(r => r.status === 'fulfilled').flatMap(r => r.value)
    .filter(it => it.title && !SKIP_TITLE.test(it.title) && /^https?:\/\//.test(it.link));
  if (!items.length) throw new Error('no items');
  try { localStorage.setItem(FEED_CACHE_KEY, JSON.stringify({ day: todayKey(), at: Date.now(), items })); } catch {}
  return items;
}

function rankForMood(items, mood, dayKey) {
  const count = (text, words) => words.reduce((s, w) => s + (text.includes(w) ? 1 : 0), 0);
  return items.map(it => {
    const t = it.title.toLowerCase(), s = it.summary.toLowerCase();
    const words = text => ' ' + text.replace(/[^a-z0-9'-]+/g, ' ') + ' ';
    let score = count(t, mood.kw) * 2 + count(s, mood.kw) + count(t + ' ' + s, UPLIFT);
    // 무거운 단어는 단어 단위로 찾아 크게 감점 ('die'가 'diet'에 걸리지 않도록)
    const heavy = HEAVY.map(w => ` ${w} `);
    score -= count(words(t), heavy) * 5 + count(words(s), heavy) * 2;
    score += it.bonus || 0;                                  // 좋은 소식 전문 매체 가산점
    if (keyOf(new Date(it.date)) === dayKey) score += 2;     // 그날 나온 소식 우선
    return { it, score };
  }).sort((a, b) => b.score - a.score || b.it.date.localeCompare(a.it.date)).map(x => x.it);
}

let newsBusy = false;
async function pickNews(skipCurrent) {
  const k = todayKey();
  const e = entries[k];
  if (!e || !e.mood || newsBusy) return;
  const mood = findMood(e.mood);
  if (!mood) return;
  newsBusy = true;
  showNewsState('오늘의 소식을 찾는 중…');
  try {
    const ranked = rankForMood(await getFeedItems(), mood, k);
    const seen = new Set(skipCurrent && e.news ? [...(e.news.seen || []), e.news.link] : []);
    let pick = ranked.find(it => !seen.has(it.link));
    if (!pick) { seen.clear(); pick = ranked[0]; }       // 다 봤으면 처음부터
    showNewsState('한국어로 옮기는 중…');
    const ko = await translateNews(pick);
    e.news = { ...pick, ...ko, mood: mood.e, seen: [...seen] };
    persist();
    renderNews(e.news);
    renderCalendar();
  } catch {
    showNewsState('소식을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', true);
  } finally { newsBusy = false; }
}

// ---------- 번역 (영어 → 한국어) ----------
async function translate(text) {
  if (!text) return '';
  try {   // 1순위: 구글 번역 공개 엔드포인트
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=' + encodeURIComponent(text));
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const out = j[0].map(seg => seg[0]).join('');
    if (out) return out;
  } catch {}
  try {   // 2순위: MyMemory (요청당 500자 제한이라 문장 단위로 나눠 보냄)
    const parts = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
    const chunks = [];
    for (const p of parts) {
      if (chunks.length && (chunks[chunks.length - 1] + p).length < 450) chunks[chunks.length - 1] += p;
      else chunks.push(p.slice(0, 450));
    }
    const res = await Promise.all(chunks.map(async c => {
      const r = await fetch('https://api.mymemory.translated.net/get?langpair=en|ko&q=' + encodeURIComponent(c));
      const j = await r.json();
      if (j.responseStatus !== 200) throw new Error(j.responseDetails);
      return j.responseData.translatedText;
    }));
    return res.join(' ');
  } catch {}
  return '';   // 번역 실패 시 원문만 보여줍니다
}
async function translateNews(n) {
  const [titleKo, summaryKo] = await Promise.all([translate(n.title), translate(n.summary)]);
  return { titleKo, summaryKo };
}

function showNewsState(msg, retry) {

    t.style.marginLeft = '0';
    t.onclick = () => { orig.hidden = !orig.hidden; t.textContent = orig.hidden ? '원문 보기' : '원문 접기'; };
    foot.appendChild(t);
  }
  const a = document.createElement('a');
  a.href = n.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = '기사 전체 ↗';
  foot.appendChild(a);
  const isToday = entries[todayKey()] && entries[todayKey()].news === n;
  if (isToday) {

  // 이전 버전에서 저장된(번역 없는) 오늘 소식은 지금 번역해 둡니다
  if (isToday && !hasKo && !n.translateTried) {
    n.translateTried = true;
    translateNews(n).then(ko => {
      if (!ko.titleKo && !ko.summaryKo) return;
      Object.assign(n, ko); persist();
      if (entries[todayKey()] && entries[todayKey()].news === n) { renderNews(n); renderCalendar(); }
    });
  }
}

// ---------- 한국 공휴일 ----------
// 음력 공휴일(설날·부처님오신날·추석)의 양력 날짜. 이 표에 있는 해만 음력 공휴일이 표시됩니다.
const LUNAR = {
  2025: { seol: '01-29', buddha: '05-05', chuseok: '10-06' },
  2026: { seol: '02-17', buddha: '05-24', chuseok: '09-25' },
  2027: { seol: '02-07', buddha: '05-13', chuseok: '09-15' },
  2028: { seol: '01-27', buddha: '05-02', chuseok: '10-03' },   // 한국시간 기준 초하루라 중국(1/26)과 하루 다름
  2029: { seol: '02-13', buddha: '05-20', chuseok: '09-22' },
  2030: { seol: '02-03', buddha: '05-09', chuseok: '09-12' },
};
// 선거일·임시공휴일 등 그해에만 있는 공휴일
const SPECIAL_HOLIDAYS = {
  '2025-01-27': '임시공휴일', '2025-06-03': '대통령 선거일', '2026-06-03': '지방선거일',
};
const holidayCache = {};
function holidaysFor(y) {
  if (holidayCache[y]) return holidayCache[y];
  const map = {};   // 'YYYY-MM-DD' → [{ name, sub, end }]
  const add = (date, name, sub, end) => {
    const k = keyOf(date);
    (map[k] = map[k] || []).push({ name, sub, end: end || date, lunar: !!end });
  };
  // [월, 일, 이름, 대체공휴일 적용 여부]
  const fixed = [[1, 1, '신정', false], [3, 1, '3·1절', true], [5, 5, '어린이날', true], [6, 6, '현충일', false],
    [8, 15, '광복절', true], [10, 3, '개천절', true], [10, 9, '한글날', true], [12, 25, '성탄절', true]];
  if (y >= 2026) fixed.push([5, 1, '노동절', true], [7, 17, '제헌절', true]);   // 2026년부터 공휴일
  for (const [m, d, n, s] of fixed) add(new Date(y, m - 1, d), n, s);
  const L = LUNAR[y];
  if (L) {
    for (const [key, name] of [['seol', '설날'], ['chuseok', '추석']]) {
      const [m, d] = L[key].split('-').map(Number);
      const end = new Date(y, m - 1, d + 1);
      add(new Date(y, m - 1, d - 1), name + ' 연휴', true, end);
      add(new Date(y, m - 1, d), name, true, end);
      add(end, name + ' 연휴', true, end);
    }
    const [bm, bd] = L.buddha.split('-').map(Number);
    add(new Date(y, bm - 1, bd), '부처님오신날', true);
  }
  for (const [k, n] of Object.entries(SPECIAL_HOLIDAYS)) if (k.startsWith(y + '-')) {
    const [, m, d] = k.split('-').map(Number); add(new Date(y, m - 1, d), n, false);
  }

  // 대체공휴일: 설·추석은 일요일이나 다른 공휴일과 겹칠 때, 그 밖의 대상 공휴일은 토·일요일이나 다른 공휴일과 겹칠 때
  // 연휴(또는 그날) 다음의 첫 평일 비공휴일로 하루씩 지정합니다.
  const requests = [];
  for (const k of Object.keys(map).sort()) {
    const list = map[k];
    const dow = new Date(k + 'T00:00').getDay();
    const eligible = list.filter(h => h.sub);
    if (!eligible.length) continue;
    const weekendHits = eligible.filter(h => dow === 0 || (dow === 6 && !h.lunar));
    if (weekendHits.length) weekendHits.forEach(h => requests.push(h));
    else if (list.length > 1) requests.push(eligible.reduce((a, b) => (b.end > a.end ? b : a)));
  }
  const isOff = dt => dt.getDay() === 0 || dt.getDay() === 6 || map[keyOf(dt)];
  for (const h of requests) {
    const dt = new Date(h.end);
    do dt.setDate(dt.getDate() + 1); while (isOff(dt));
    const base = h.name.replace(' 연휴', '');
    add(dt, `대체공휴일(${base})`, false);
  }
  return (holidayCache[y] = map);
}
const holidayNames = k => (holidaysFor(+k.slice(0, 4))[k] || []).map(h => h.name);

// 미국 동부시간 → 한국시간. 미국 서머타임: 3월 둘째 일요일 ~ 11월 첫째 일요일
function nthSunday(y, m, n) { const d = new Date(y, m - 1, 1); d.setDate(1 + (7 - d.getDay()) % 7 + 7 * (n - 1)); return d.getDate(); }
function etToKst(k, hhmm) {
  const [y, m, d] = k.split('-').map(Number);
  const [h, mi] = hhmm.split(':').map(Number);
  const dst = (m > 3 && m < 11) || (m === 3 && d >= nthSunday(y, 3, 2)) || (m === 11 && d < nthSunday(y, 11, 1));
  const t = new Date(Date.UTC(y, m - 1, d, h + (dst ? 4 : 5), mi) + 9 * 3600e3);
  const H = t.getUTCHours(), ap = H < 12 ? '오전' : '오후', h12 = H % 12 || 12;
  return `${t.getUTCMonth() + 1}월 ${t.getUTCDate()}일(${DAYS[t.getUTCDay()]}) ${ap} ${h12}:${pad(t.getUTCMinutes())}`;
}

const nowD = new Date();
const cal = { y: nowD.getFullYear(), m: nowD.getMonth() + 1, sel: todayKey() };

function renderCalendar() {
  const { y, m } = cal;
  $('calTitle').textContent = `${y}년 ${m}월`;
  const grid = $('calGrid');
  grid.innerHTML = '';
  DAYS.forEach((d, i) => {
    const h = document.createElement('div');
    h.className = 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    h.textContent = d;
    grid.appendChild(h);
  });
  const first = new Date(y, m - 1, 1);
  const start = new Date(y, m - 1, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m, 0).getDate()) / 7);
  const tk = todayKey();
  for (let i = 0; i < weeks * 7; i++) {
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = keyOf(dt);
    const hol = holidayNames(k);
    const ev = ECON[k] || [];
    const e = entries[k];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day'
      + (dt.getMonth() !== m - 1 ? ' other' : '')
      + (dt.getDay() === 0 ? ' sun' : dt.getDay() === 6 ? ' sat' : '')
      + (hol.length ? ' hol' : '')
      + (k === tk ? ' today' : '')
      + (k === cal.sel ? ' sel' : '');
    const mo = e && findMood(e.mood);
    if (mo) b.classList.add('m-' + mo.id);
    const num = document.createElement('div'); num.className = 'num';
    const n = document.createElement('span'); n.textContent = dt.getDate();
    num.appendChild(n);
    if (e) {
      const mk = document.createElement('span'); mk.className = 'mark';
      mk.textContent = e.mood || e.weather || '✏️';
      num.appendChild(mk);
    }
    b.appendChild(num);
    if (hol.length) {
      const hn = document.createElement('div'); hn.className = 'hname'; hn.textContent = hol.join(', ');
      b.appendChild(hn);
    }
    if (ev.length) {
      const chips = document.createElement('div'); chips.className = 'chips';
      for (const x of ev) {
        const c = document.createElement('span'); c.className = 'chip ' + x.cls; c.textContent = x.chip;
        chips.appendChild(c);
      }
      b.appendChild(chips);
    }
    b.setAttribute('aria-label', [pretty(k, true), ...hol, ...ev.map(x => x.title), e ? '일기 있음' : ''].filter(Boolean).join(', '));
    b.onclick = () => {
      cal.sel = k;
      if (dt.getMonth() !== m - 1) { cal.y = dt.getFullYear(); cal.m = dt.getMonth() + 1; }
      renderCalendar();
    };
    grid.appendChild(b);
  }
  const notes = [];
  if (!ECON_YEARS.includes(y)) notes.push(`${y}년 미국 경제 일정은 아직 넣어 두지 않았어요 (${ECON_YEARS.join('·')}년만 있어요).`);
  if (!BOK_YEARS.includes(y)) notes.push(`${y}년 한국은행 금통위 일정은 아직 넣어 두지 않았어요.`);
  if (!LUNAR[y]) notes.push(`${y}년은 설날·추석·부처님오신날 날짜가 없어 양력 공휴일만 표시돼요.`);
  $('calNote').textContent = notes.join(' ');
  renderCalEvents(cal.sel);
  renderCalDiary(cal.sel);
}

// 일기 카드의 내용을 입력칸으로 바꿔 수정합니다 (Enter 저장 · Esc 취소 · 비우면 삭제)
function startEdit(k, t) {
  const input = document.createElement('input');
  input.type = 'text'; input.maxLength = MAX; input.value = entries[k].text;
  t.replaceChildren(input);
  input.focus();
  let done = false;
  const finish = commit => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (commit) { if (v) entries[k].text = v; else delete entries[k]; save(); } else renderCalDiary(k);
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) finish(true);
    if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
}

}

  const v = $('todayInput').value.trim();
  const k = todayKey();
  if (!v) {
    if (entries[k] && !confirm('내용이 비어 있어요. 오늘 기록을 삭제할까요?')) return;
    delete entries[k];
    save();
    return;

  const prev = entries[k] || {};
  entries[k] = { ...prev, text: v, weather: draft.weather, mood: draft.mood };
  if (!draft.mood) delete entries[k].news;
  save();
  const m = $('savedMsg'); m.classList.add('show');
  setTimeout(() => m.classList.remove('show'), 1500);
  // 기분이 정해졌고, 아직 그 기분에 맞춘 소식이 없으면 새로 찾기
  if (draft.mood && (!prev.news || prev.news.mood !== draft.mood)) pickNews(false);
};
$('todayInput').oninput = updateCount;

function exportDiary() {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `한줄일기-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  saveBackup({ last: todayKey(), sig: sigOf(entries) });
  renderBackup();
}
$('exportBtn').onclick = exportDiary;
$('backupNow').onclick = exportDiary;
$('backupLater').onclick = () => {
  saveBackup({ ...loadBackup(), snooze: todayKey() });
  renderBackup();
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const valid = Object.entries(data)
      .filter(([k]) => /^\d{4}-\d{2}-\d{2}$/.test(k))
      .map(([k, v]) => [k, normalize(v)]).filter(([, v]) => v);
    if (!valid.length) throw new Error('empty');
    if (!confirm(`${valid.length}개의 기록을 가져올까요? 같은 날짜는 덮어써요.`)) return;
    for (const [k, v] of valid) entries[k] = { ...v, text: v.text.slice(0, MAX) };
    save();
  } catch { alert('올바른 일기 파일이 아니에요.'); }
  e.target.value = '';
};

// 자정이 지나면 날짜 갱신
let lastDay = todayKey();
setInterval(() => {
  if (todayKey() === lastDay) return;
  // 오늘이 있는 달을 보고 있었다면 새 날짜로 따라갑니다
  if (cal.sel === lastDay) { const d = new Date(); cal.y = d.getFullYear(); cal.m = d.getMonth() + 1; cal.sel = todayKey(); }
  lastDay = todayKey();
  renderAll();
}, 60000);

buildPicker($('weatherPicker'), WEATHERS, 'weather');
buildPicker($('moodPicker'), MOODS, 'mood');
buildMoodLegend();
renderAll();
// 폰에서는 자동 포커스가 키보드를 띄워 화면을 가리므로 넓은 화면에서만
if (!matchMedia('(max-width: 480px)').matches) $('todayInput').focus();

// ---------- 앱 설치 (PWA) ----------
// 서비스 워커는 http(s)에서만 동작합니다. 파일로 직접 열었을 때(file://)는 건너뜁니다.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// 브라우저가 저장 공간이 부족할 때 일기를 지우지 않도록 요청합니다 (지원하는 브라우저만)
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
